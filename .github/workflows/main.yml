name: Default
on:
  merge_group:
  push:
    branches:
      - main
      - releases/*
      - release/*
  pull_request:
    types: [ assigned, opened, synchronize, reopened, labeled, edited ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    if: github.event_name == 'pull_request'
    uses: formancehq/ci/.github/workflows/go-pr.yml@v1
    permissions:
      pull-requests: read
      statuses: write

  Dirty:
    uses: formancehq/ci/.github/workflows/go-dirty.yml@v1
    with:
      pre-commit-target: pc
    secrets:
      GIT_PRIVATE_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      NUMARY_GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}

  TestsUnit:
    name: Tests (Unit)
    runs-on: namespace-profile-linux-amd64-4vcpu
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - uses: formancehq/ci/actions/setup-nix@v1

      - run: nix develop --impure --command just tests-unit

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-report
          path: ./coverage/unit_filtered.txt

  TestsIntegration:
    name: Tests (Integration)
    runs-on: namespace-profile-linux-amd64-4vcpu
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - uses: formancehq/ci/actions/setup-nix@v1

      - run: nix develop --impure --command just tests-integration

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-report
          path: ./coverage/integration_filtered.txt

  Tests:
    needs: [TestsUnit, TestsIntegration]
    uses: formancehq/ci/.github/workflows/go-test-coverage.yml@v1
    with:
      coverage-files: unit_filtered.txt,integration_filtered.txt
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  GoReleaser:
    needs: [Dirty]
    uses: formancehq/ci/.github/workflows/go-build.yml@v1
    with:
      build-condition: main-and-label
      build-label: build-images
    secrets:
      NUMARY_GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
      GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

  Deploy:
    runs-on: namespace-profile-linux-amd64-2vcpu
    if: github.ref == 'refs/heads/main'
    environment: staging
    permissions:
      contents: read
      id-token: write
    needs:
      - GoReleaser
      - Dirty
      - Tests
    steps:
      - uses: formancehq/ci/actions/deploy-staging@v1
        with:
          component: agent
          tag: ${{ github.sha }}
          auth-token: ${{ secrets.ARGOCD_REGION_AUTH_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OIDC_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_OIDC_AUDIENCE }}
          ts-tags: ${{ vars.TS_TAGS }}
          ts-version: ${{ vars.TS_VERSION }}
          ts-args: ${{ vars.TS_ARGS }}
          ts-retry: ${{ vars.TS_RETRY }}
          ts-timeout: ${{ vars.TS_TIMEOUT }}
          ts-ping: ${{ vars.TS_PING }}
